apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.clientDeploymentName }}
  labels:
    app: client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: client
  template:
    metadata:
      labels:
        app: client
    spec:
      containers:
        - name: mern-client
          image: bharadwajreddy1406/mern-client:latest
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
